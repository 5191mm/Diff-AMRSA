name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install rdkit==2025.3.2 numpy pytest setuptools wheel
      - name: Check source and scripts
        run: |
          python -m compileall -q src scripts data_processing evaluation tests
          bash -n scripts/run_pipeline.sh scripts/run_legacy_pipeline.sh
      - name: Run component tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/diff_amrsa
      - name: Build Python distribution
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Verify release data exclusions
        run: |
          test ! -e processed_drug_mic_dataset.csv
          test ! -e mrsa_scheme_a
          test -f LICENSE.md
          test -f assets/diff_amrsa_overview.png
